name: Llibrary CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  library:
    uses: MrRamPoudel/shared-dotnet-library-pipeline/.github/workflows/dotnet-library-pipeline.yml@v1
    with:
      version-increment: patch
      dotnet-version: 10.0.400
    permissions:
      contents: write
      packages: write